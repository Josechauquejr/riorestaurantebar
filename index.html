button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}

.cover .label{display:flex;align-items:center;padding-top:0}

.brand{margin:0}
.logo{display:block;width:min(76vw,370px);height:auto;margin:0}
.sub{margin:16px 0 32px;font-size:clamp(10px,2.8vw,13px);font-weight:500;letter-spacing:.14em;text-transform:uppercase;line-height:1.7}
.btn{color:var(--cream);text-decoration:none;font-weight:600;font-size:14px;padding:12px 24px;border:1.5px solid var(--cream);border-radius:999px}
.btn:hover{background:var(--cream);color:var(--g3)}
.items{display:flex;flex-direction:column;justify-content:center;padding:64px 16px 140px 20px}
.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;margin:0 0 clamp(18px,3.2svh,28px)}
.item:last-child{margin-bottom:0}
.item{position:relative}
.chalk{position:absolute;pointer-events:none;overflow:visible;z-index:2;transition:opacity .7s}
.chalk.fade{opacity:0}
.chalk path{fill:none;stroke:#fffaf0;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}
.search{position:relative;z-index:6;width:100%;max-width:360px;margin-top:18px}
.sbox{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;border-radius:999px}
.sbox svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.sbox input{flex:1;width:0;min-width:0;background:none;border:0;outline:0;-webkit-appearance:none;appearance:none;color:var(--cream);font:500 16px 'Montserrat',sans-serif}

.meta small{font-size:11px;font-weight:500}
.price{font-size:clamp(16px,4.2vw,20px);font-weight:700;white-space:nowrap}

  footer .logo{width:70mm}
  .river{width:100%;height:38mm;left:auto;margin:10mm 0 6mm}

"Mojito":["Rum, hortelã, lima e açúcar","Rum, mint, lime and sugar"],

"Strawberry Daiquiri":["Rum, morango e lima","Rum, strawberry and lime"],

const CAIP={"Maracujá":["maracujá","passion fruit"],"Limão":["limão","lime"],"Morango":["morango","strawberry"],"Ananás":["ananás","pineapple"]};
Object.entries(CAIP).forEach(([k,[p,e]])=>DESC["cai"+k]=[`Cachaça, ${p}, açúcar e gelo`,`Cachaça, ${e}, sugar and ice`]);
const ICON={food:'<path d="M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3Zm0 0v7"/>',
drinks:'<path d="M17 11h1a3 3 0 0 1 0 6h-1M9 12v6M13 12v6M14 7.5c-1 0-1.4.5-3 .5s-2-.5-3-.5-1.7.5-2.5.5a2.5 2.5 0 0 1 0-5c.8 0 1.6.5 2.5.5S9.4 2 11 2s2 1.5 3 1.5 1.7-.5 2.5-.5a2.5 2.5 0 0 1 0 5c-.8 0-1.5-.5-2.5-.5ZM5 8v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/>',
wine:'<path d="M8 22h8M7 10h10M12 15v7M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z"/>',
cock:'<path d="M8 22h8M12 11v11m7-19-7 8-7-8Z"/>',
spirit:'<path d="M15.2 22H8.800a2 2 0 0 1-2-1.800L5 3h14l-1.8 17.200a2 2 0 0 1-2 1.800ZM6 12a5 5 0 0 1 6 0 5 5 0 0 0 6 0"/>'};
const GROUPS=[["Comida","Food",0,6,"food"],["Bebidas","Drinks",6,9,"drinks"],["Vinhos","Wines",9,13,"wine"],["Cocktails","Cocktails",13,16,"cock"],["Destilados","Spirits",16,20,"spirit"]];
const list=document.getElementById("list"),pill=document.getElementById("pill"),subs=document.getElementById("subs");
const catName=c=>T(esc(c),CEN[c]);
MENU.forEach(([cat,items],i)=>{
  list.insertAdjacentHTML("beforeend",`<section class="row" id="c${i}" data-i="${i}"><div class="label"><b>${catName(cat)}</b></div><div class="items">`+
  items.map(([nm,d,p],k)=>{const ds=DESC[cat==="Caipirinhas"?"cai"+nm:nm];
    return `<div class="item" id="i${i}-${k}"><div class="info"><h3>${T(esc(nm),esc(EN[nm]||nm))}</h3>${ds?`<p>${T(ds[0],ds[1])}</p>`:""}</div><div class="meta">${d?`<small>${T(esc(d),esc(d.replace("para ","for ").replace(",",".")))}</small>`:""}<div class="price">${fmt(p)}<i>MT</i></div></div></div>`}).join("")+`</div></section>`);
});
pill.innerHTML=GROUPS.map((g,k)=>`<button data-g="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[g[4]]}</svg>${T(g[0],g[1])}</button>`).join("");
let lock=false,tm;
const root=document.documentElement;
function release(){lock=false;root.style.scrollSnapType="";update();if(afterJump){const f=afterJump;afterJump=null;f()}}
let afterJump=null;
function jump(i,el,cb){lock=true;afterJump=cb||null;root.style.scrollSnapType="none";setActive(i);clearTimeout(tm);tm=setTimeout(release,1500);(el||document.getElementById("c"+i)).scrollIntoView({behavior:"smooth",block:el?"center":"start"})}
addEventListener("scroll",()=>{if(lock){clearTimeout(tm);tm=setTimeout(release,160)}},{passive:true});
pill.onclick=e=>{const b=e.target.closest("button");if(b)jump(GROUPS[b.dataset.g][2])};
subs.onclick=e=>{const b=e.target.closest("button");if(b)jump(+b.dataset.i)};
let curG=-2;
let curI=-9;
function setActive(i){if(i===curI)return;curI=i;
  const g=GROUPS.findIndex(x=>i>=x[2]&&i<x[3]);
  document.getElementById("dock").classList.toggle("off",i<0);
  [...pill.children].forEach((b,k)=>b.classList.toggle("on",k===g));
  if(g!==curG){curG=g;subs.hidden=g<0;subs.innerHTML=g<0?"":MENU.slice(GROUPS[g][2],GROUPS[g][3]).map((m,k)=>`<button data-i="${GROUPS[g][2]+k}">${catName(m[0])}</button>`).join("")}
  subs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
  const on=subs.querySelector(".on");if(on)subs.scrollTo({left:on.offsetLeft-30,behavior:lock?"auto":"smooth"});
}
const secs=[...document.querySelectorAll("section")],cover=document.getElementById("top");
let raf=0;
function update(){raf=0;if(lock)return;const mid=innerHeight/2;
  if(cover.getBoundingClientRect().bottom>mid){setActive(-1);return}
  let cur=0;secs.forEach((s,k)=>{if(s.getBoundingClientRect().top<=mid)cur=k});setActive(cur)}
addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(update)},{passive:true});
addEventListener("resize",update);addEventListener("pageshow",update);update();
const q=document.getElementById("q"),res=document.getElementById("res");
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const IDX=[];
MENU.forEach(([cat,items],i)=>items.forEach(([nm,d,p],k)=>{const ds=DESC[cat==="Caipirinhas"?"cai"+nm:nm]||["",""],en=EN[nm]||nm,cen=CEN[cat]||cat;
  IDX.push({i,k,nm,en,cat,cen,p,nk:norm(nm+" "+en),key:norm([nm,en,cat,cen,ds[0],ds[1]].join(" "))})}));
function renderRes(){
  const t=norm(q.value).trim().split(/\s+/).filter(Boolean);
  if(!t.length){res.hidden=true;res.innerHTML="";return}
  const en=root.dataset.l==="en",sc=x=>t.every(w=>x.nk.includes(w))?1:0;
  const r=IDX.filter(x=>t.every(w=>x.key.includes(w))).sort((a,b)=>sc(b)-sc(a)).slice(0,8);
  res.hidden=false;
  res.innerHTML=r.length?r.map(x=>`<button data-i="${x.i}" data-k="${x.k}"><span><b>${esc(en?x.en:x.nm)}</b><small>${esc(en?x.cen:x.cat)}</small></span><i>${fmt(x.p)} MT</i></button>`).join(""):`<p>${en?"No results":"Sem resultados"}</p>`;
}
function chalk(el){
  document.querySelectorAll(".chalk").forEach(x=>x.remove());
  const px=14,py=10,W=el.offsetWidth+px*2,H=el.offsetHeight+py*2,cx=W/2,cy=H/2,rx=W/2-3,ry=H/2-3,N=72;let d="";
  for(let k=0;k<=N;k++){const a=-1.9+(k/N)*(Math.PI*2+.6),f=1+.025*Math.sin(k*1.7)+.02*Math.sin(k*.6+1)+.05*(k/N);
    d+=(k?"L":"M")+(cx+rx*f*Math.cos(a)).toFixed(1)+" "+(cy+ry*f*Math.sin(a)).toFixed(1)}
  el.insertAdjacentHTML("beforeend",`<svg class="chalk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="left:${-px}px;top:${-py}px"><path d="${d}"/></svg>`);
  const s=el.lastElementChild,p=s.querySelector("path"),len=p.getTotalLength();
  p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.getBoundingClientRect();
  p.style.transition="stroke-dashoffset 1s ease-out";p.style.strokeDashoffset=0;
  setTimeout(()=>{s.classList.add("fade");setTimeout(()=>s.remove(),800)},3800);
}
q.oninput=renderRes;q.onfocus=renderRes;
const dlBtn=document.getElementById("dl");
q.onkeydown=e=>{if(e.key==="Enter"){const b=res.querySelector("button");if(b)b.click()}};
res.onclick=e=>{const b=e.target.closest("button");if(!b)return;
  const el=document.getElementById(`i${b.dataset.i}-${b.dataset.k}`);
  q.blur();q.value="";res.hidden=true;res.innerHTML="";jump(+b.dataset.i,el,()=>chalk(el))};
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.hidden=true});
const langBtns=[...document.querySelectorAll("#lang button")];
function setLang(l){document.documentElement.dataset.l=l;dlBtn.href=l==="en"?"menu-rio-en.pdf":"menu-rio-pt.pdf";dlBtn.setAttribute("download",l==="en"?"Menu-Rio-EN.pdf":"Menu-Rio-PT.pdf");q.placeholder=l==="en"?"Something in mind?":"Algo em mente?";renderRes();document.documentElement.lang=l;langBtns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));try{localStorage.setItem("lang",l)}catch(e){}}
langBtns.forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let sv=null;try{sv=localStorage.getItem("lang")}catch(e){}
setLang(sv==="en"?"en":"pt");
</script>
